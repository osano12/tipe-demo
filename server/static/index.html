<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Trash Dashboard - TIPE</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4caf50;
            --bio-color: #4caf50;
            --recyclable-color: #2196f3;
            --waste-color: #f44336;
            --unknown-color: #9e9e9e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            grid-template-rows: auto 1fr;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            grid-column: 1 / span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .health-container {
            display: flex;
            gap: 20px;
        }

        .health-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #555;
            transition: all 0.3s;
        }

        .online {
            background-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
        }

        .offline {
            background-color: var(--waste-color);
            box-shadow: 0 0 8px var(--waste-color);
        }

        .main-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        .camera-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .camera-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28); }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .bio {
            background: var(--bio-color);
        }

        .recyclable {
            background: var(--recyclable-color);
        }

        .waste {
            background: var(--waste-color);
        }

        .inconnu {
            background: var(--unknown-color);
        }

        .event-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
            animation: reveal 220ms ease both;
        }

        .event-img {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            object-fit: cover;
            background: #333;
        }

        .event-info {
            flex-grow: 1;
        }

        .event-time {
            font-size: 0.7rem;
            color: #888;
        }

        .btn-db {
            display: block;
            text-align: center;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-db:hover {
            background: var(--accent-color);
            color: white;
        }

        .btn-db:disabled { cursor: wait; opacity: 0.65; }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 820px) {
            body { display: block; height: auto; min-height: 100vh; overflow: auto; padding: 12px; }
            header { margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
            .main-view, .sidebar { margin-bottom: 12px; }
            .camera-card { min-height: 48vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>

    <header>
        <h1> Poubelle IA Dashboard</h1>
        <div class="health-container">
            <div class="health-item">
                <span id="ai-label">IA</span> <span id="ai-status" class="status-dot"></span>
            </div>
            <div class="health-item">
                Caméra <span id="camera-status" class="status-dot"></span>
            </div>
        </div>
    </header>

    <div class="main-view">
        <div class="camera-card">
            <span class="camera-label">LIVE STREAM</span>
            <img src="/camera/stream" alt="Flux caméra en direct">
        </div>

        <div class="card">
            <h2>Derniers événements</h2>
            <div id="latest-events" class="event-list">
                Chargement des données...
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="card">
            <h2>Statistiques globales</h2>
            <div id="stats-container">
            </div>
        </div>

        <div class="card">
            <h2>Outils</h2>
            <button id="btn-simulate" class="btn-db"
                style="cursor:pointer; width:100%; margin-bottom:10px; background:#2e7d32; color:white;"> Simuler
                Détection (PIR)</button>
            <a href="/api/db/download" class="btn-db" style="border-color: #888; color: #888;">Télécharger app.db</a>
        </div>
    </div>

    <script>
        async function updateHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                document.getElementById('ai-label').textContent = `IA · ${data.ai_provider}`;
                document.getElementById('ai-status').className = 'status-dot ' + (data.ai === 'online' ? 'online' : 'offline');
                document.getElementById('camera-status').className = 'status-dot ' + (data.camera === 'online' ? 'online' : 'offline');
            } catch (e) { console.error("Health check failed"); }
        }

        async function updateStats() {
            try {
                const resRank = await fetch('/api/rank');
                const dataRank = await resRank.json();
                const container = document.getElementById('stats-container');
                container.innerHTML = dataRank.items.map(item => `
                    <div class="stat-row">
                        <span class="badge ${item.label}">${item.label}</span>
                        <strong>${item.count}</strong>
                    </div>
                `).join('');

                const resEvents = await fetch('/api/events?limit=5');
                const dataEvents = await resEvents.json();
                const eventList = document.getElementById('latest-events');
                eventList.innerHTML = dataEvents.items.map(ev => `
                    <div class="event-item">
                        <img src="${ev.image_path || '#'}" class="event-img" alt="Waste">
                        <div class="event-info">
                            <div style="display:flex; justify-content:space-between">
                                <span class="badge ${ev.label}">${ev.label}</span>
                                <span style="font-size:0.8rem; color:var(--accent-color)">${Math.round(ev.confidence * 100)}%</span>
                            </div>
                            <div class="event-time">${ev.timestamp}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error("Stats update failed"); }
        }

        document.getElementById('btn-simulate').onclick = async () => {
            const btn = document.getElementById('btn-simulate');
            btn.innerText = "⏳ Analyse en cours...";
            btn.disabled = true;
            try {
                const res = await fetch('/api/debug/simulate-pir', { method: 'POST' });
                if (!res.ok) throw new Error(await res.text());
                await updateStats();
            } catch (e) { alert("Erreur lors de la simulation"); }
            btn.innerText = "🚀 Simuler Détection (PIR)";
            btn.disabled = false;
        };

        setInterval(updateHealth, 5000);
        setInterval(updateStats, 3000);
        updateHealth();
        updateStats();
    </script>
</body>

</html>
